name: Pixel renderer release gate

on:
  pull_request:
    paths:
      - ".github/workflows/visual-assets.yml"
      - "assets/shaders/**"
      - "assets/pixel_art/**"
      - "assets/visual_asset_attribution.json"
      - "assets/visual_assets.json"
      - "export_presets.cfg"
      - "project.godot"
      - "resources/**"
      - "scenes/**"
      - "scripts/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/visual-assets.yml"
      - "assets/shaders/**"
      - "assets/pixel_art/**"
      - "assets/visual_asset_attribution.json"
      - "assets/visual_assets.json"
      - "export_presets.cfg"
      - "project.godot"
      - "resources/**"
      - "scenes/**"
      - "scripts/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Godot 4.4.1 with Web templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Run focused renderer and Web release gates
        run: python3 tools/run_pixel_release_gate.py --web-export

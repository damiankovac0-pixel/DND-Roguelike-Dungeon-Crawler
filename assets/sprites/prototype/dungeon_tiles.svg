<svg xmlns="http://www.w3.org/2000/svg" width="112" height="16" viewBox="0 0 112 16" shape-rendering="crispEdges">
  <!-- floor -->
  <g transform="translate(0 0)">
    <rect width="16" height="16" fill="#171b27"/>
    <rect x="2" y="3" width="2" height="1" fill="#32384a"/>
    <rect x="10" y="9" width="3" height="1" fill="#2a3040"/>
    <rect x="6" y="14" width="1" height="1" fill="#41485a"/>
  </g>
  <!-- wall -->
  <g transform="translate(16 0)">
    <rect width="16" height="16" fill="#272235"/>
    <rect y="1" width="16" height="3" fill="#756488"/>
    <rect y="5" width="16" height="4" fill="#564866"/>
    <rect y="10" width="16" height="5" fill="#40364f"/>
    <rect x="7" y="5" width="1" height="4" fill="#2d2639"/>
    <rect x="3" y="10" width="1" height="5" fill="#2d2639"/>
    <rect x="12" y="10" width="1" height="5" fill="#2d2639"/>
  </g>
  <!-- closed door -->
  <g transform="translate(32 0)">
    <rect width="16" height="16" fill="#171b27"/>
    <rect x="3" y="1" width="10" height="15" fill="#4a2e20"/>
    <rect x="4" y="2" width="8" height="14" fill="#7b4a2a"/>
    <rect x="5" y="3" width="6" height="12" fill="#5f381f"/>
    <rect x="9" y="8" width="2" height="2" fill="#e3bb55"/>
  </g>
  <!-- open door -->
  <g transform="translate(48 0)">
    <rect width="16" height="16" fill="#171b27"/>
    <rect x="2" y="1" width="2" height="15" fill="#7b4a2a"/>
    <rect x="12" y="1" width="2" height="15" fill="#7b4a2a"/>
    <rect x="4" y="2" width="2" height="13" fill="#4a2e20"/>
    <rect x="6" y="13" width="6" height="2" fill="#5f381f"/>
  </g>
  <!-- stairs -->
  <g transform="translate(64 0)">
    <rect width="16" height="16" fill="#171b27"/>
    <rect x="2" y="3" width="12" height="2" fill="#d9c56b"/>
    <rect x="4" y="6" width="10" height="2" fill="#b5a153"/>
    <rect x="6" y="9" width="8" height="2" fill="#8f7d43"/>
    <rect x="8" y="12" width="6" height="2" fill="#665a37"/>
  </g>
  <!-- boss door -->
  <g transform="translate(80 0)">
    <rect width="16" height="16" fill="#171b27"/>
    <rect x="2" y="1" width="12" height="15" fill="#392711"/>
    <rect x="3" y="2" width="10" height="14" fill="#8e5d18"/>
    <rect x="5" y="2" width="2" height="14" fill="#d29a30"/>
    <rect x="9" y="2" width="2" height="14" fill="#d29a30"/>
    <rect x="3" y="7" width="10" height="2" fill="#f0c95a"/>
  </g>
  <!-- sealed boss door -->
  <g transform="translate(96 0)">
    <rect width="16" height="16" fill="#171b27"/>
    <rect x="2" y="1" width="12" height="15" fill="#4c1018"/>
    <rect x="3" y="2" width="10" height="14" fill="#7e1823"/>
    <rect x="4" y="3" width="2" height="2" fill="#ff5963"/>
    <rect x="6" y="5" width="2" height="2" fill="#ff5963"/>
    <rect x="8" y="7" width="2" height="2" fill="#ff5963"/>
    <rect x="10" y="9" width="2" height="2" fill="#ff5963"/>
    <rect x="10" y="3" width="2" height="2" fill="#ff5963"/>
    <rect x="8" y="5" width="2" height="2" fill="#ff5963"/>
    <rect x="6" y="7" width="2" height="2" fill="#ff5963"/>
    <rect x="4" y="9" width="2" height="2" fill="#ff5963"/>
  </g>
</svg>
